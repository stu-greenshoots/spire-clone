server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;

  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml text/plain application/manifest+json;

  # fingerprinted build output never changes
  location /assets/ { add_header Cache-Control "public, max-age=31536000, immutable"; try_files $uri =404; }

  # the page shell and the service worker must always be fresh, or a new release never shows up
  location = /index.html { add_header Cache-Control "no-cache"; }
  location ~ ^/(sw|service-worker|registerSW)\.js$ { add_header Cache-Control "no-cache"; try_files $uri =404; }
  location ~ \.webmanifest$ { default_type application/manifest+json; add_header Cache-Control "no-cache"; try_files $uri =404; }

  # client-side routes fall back to the app
  location / { try_files $uri $uri/ /index.html; }

  location = /health { access_log off; return 200 "ok\n"; }
}
